            <h2>Regristrasi Akun Belajar</h2>

            <form>
                <label> Nama Lengkap</label>
                <input type="text" id="nama" : name="nama lengkap" placeholder="Masukkan nama lengkap" required>

                <input type="email" id="email" : name="alamat email" placeholder="contoh123@gmail.com" required>

                <input type="password" id="password"  placeholder="Minimal 8 karakter" required>
                <label> Kata Sandi</label>
                <input type="password" id="password"  placeholder="Ulangi kata sandi" required>
                <label>Status Pengguna</label>
                <select>
                    <option>Pilih status</option>
                    <option> Siswa</option>
                    <option>Guru</option>
                </select>
                <button type="submit"><a href="daftar.html">Daftar</a></button>
            </form>
        </div>

</html
